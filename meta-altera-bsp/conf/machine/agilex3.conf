#@TYPE: Machine
#@NAME: Altera SoCFPGA Agilex3
#@DESCRIPTION: Machine configuration for the Agilex3 SoCFPGA

require conf/machine/include/socfpga_armv8-2a.inc

# Use custom ubifs settings from meta-custom if available, otherwise use default
require ${@bb.utils.contains('BBFILE_COLLECTIONS', 'meta-custom', 'conf/machine/include/ubifs.inc', 'conf/machine/include/ubifs_agilex3.inc', d)}

# Machine name
MACHINE_STRIP = "agilex3"

# Boot source
SSBL_BOOT_SOURCE ??= "mmc0"

# U-Boot configuration - use defconfig from kas.yml
# Strip _defconfig suffix for UBOOT_CONFIG key
UBOOT_CONFIG = "agilex3-socdk-atf"
UBOOT_CONFIG[agilex3-socdk-atf] = "${UBOOT_DEFCONFIG}"

# Define multilib target
require conf/multilib.conf
MULTILIBS = "multilib:lib32"
DEFAULTTUNE:virtclass-multilib-lib32 = "armv7athf-neon"

# Conditionally add 32-bit libraries only when NOT building QSPI image
IMAGE_INSTALL:append = "${@'' if d.getVar('SSBL_BOOT_SOURCE') == 'qspi' else ' lib32-zlib'}"

# Remove kernel-modules for QSPI builds to save space
IMAGE_INSTALL:remove = "${@'kernel-modules' if d.getVar('SSBL_BOOT_SOURCE') == 'qspi' else ''}"

KBUILD_DEFCONFIG ?= "defconfig"

UBOOT_BINARY = "u-boot.itb"
UBOOT_SUFFIX = "itb"

KERNEL_CLASSES:append = " kernel-fitimage"
KERNEL_IMAGETYPE = "Image"

LINUX_DTB_FILE ?= "socfpga_agilex3_socdk.dtb"
KERNEL_DEVICETREE ?= "\
			intel/${LINUX_DTB_FILE} \
			"

UBOOT_ENTRYPOINT = "0x4000000"
UBOOT_LOADADDRESS = "0x4000000"
FIT_KERNEL_COMP_ALG = "none"

SERIAL_CONSOLES ?= "115200;ttyS0"

EXTRA_IMAGECMD:jffs2 ?= "-n -q -e 0x10000"

UBOOT_EXTLINUX ?= "1"
UBOOT_EXTLINUX_LABELS ?= "default"
UBOOT_EXTLINUX_DEFAULT_LABEL ?= "Agilex3 SOCDK SDMMC"

UBOOT_EXTLINUX_MENU_DESCRIPTION:default ?= "Agilex3 SOCDK SDMMC"
UBOOT_EXTLINUX_KERNEL_IMAGE:default ?= "../${KERNEL_IMAGETYPE}"
UBOOT_EXTLINUX_FDTDIR:default ?= ".."
UBOOT_EXTLINUX_CONSOLE ?= "console=ttyS0,115200n8"
UBOOT_EXTLINUX_KERNEL_ARGS:default ?= "rootwait rw earlyprintk"
UBOOT_EXTLINUX_ROOT:default ?= "root=/dev/mmcblk0p2"

UBOOT_DEVICE_TREE ?= "socfpga_agilex3_socdk.dtb"

# Conditionally add device-tree and fpga-bitstream only when NOT building QSPI image
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append = "${@'' if d.getVar('SSBL_BOOT_SOURCE') == 'qspi' else ' device-tree fpga-bitstream'}"

EXTRA_IMAGEDEPENDS:append = " \
		u-boot-socfpga-scr \
		u-boot-socfpga-env-var \
		"

# Add variables for wic creation of sdcard image
IMAGE_BOOT_FILES ?= " \
			${UBOOT_BINARY} \
			Image \
			"

IMAGE_TYPE ?= "gsrd"

# Optimize for QSPI builds - skip systemd and usrmerge for minimal footprint
DISTRO_FEATURES:append = "${@'' if d.getVar('SSBL_BOOT_SOURCE') == 'qspi' else ' systemd usrmerge'}"
VIRTUAL-RUNTIME_init_manager = "${@'sysvinit' if d.getVar('SSBL_BOOT_SOURCE') == 'qspi' else 'systemd'}"
CORE_IMAGE_EXTRA_INSTALL += "${@'openssh gdbserver mtd-utils net-tools' if d.getVar('SSBL_BOOT_SOURCE') == 'qspi' else ''}"

WKS_FILE ?= "sdimage.wks"
IMAGE_FSTYPES:append = " wic jffs2 tar.gz multiubi cpio cpio.gz cpio.gz.u-boot"
IMAGE_FEATURES:append = " allow-empty-password empty-root-password"
