#@TYPE: Machine
#@NAME: Altera SoCFPGA Agilex3
#@DESCRIPTION: Machine configuration for the Agilex3 SoCFPGA

require conf/machine/include/socfpga_armv8-2a.inc

# For Xen builds (HYP_BUILD=1), ubifs/jffs2 support is disabled - only SD card boot is supported
require ${@'' if d.getVar('HYP_BUILD') == '1' else bb.utils.contains('BBFILE_COLLECTIONS', 'meta-custom', 'conf/machine/include/ubifs.inc', 'conf/machine/include/ubifs_agilex3.inc', d)}

# IMAGE_CMD:multiubi (in poky) calls .split() on MULTIUBI_BUILD/MULTIUBI_ARGS at parse
# time for every image recipe. When ubifs.inc is skipped (HYP_BUILD=1), these are None
# which crashes parsing. Provide safe empty-string defaults so parsing always succeeds.
MULTIUBI_BUILD ??= ""
MULTIUBI_ARGS ??= ""

# default root home directory
ROOT_HOME = "/home/root"

# Machine name
MACHINE_STRIP = "agilex3"

# Boot source
SSBL_BOOT_SOURCE ??= "mmc0"

# U-Boot configuration - use defconfig from kas.yml
# Strip _defconfig suffix for UBOOT_CONFIG key
UBOOT_CONFIG = "agilex3-socdk-atf"
UBOOT_CONFIG[agilex3-socdk-atf] = "${UBOOT_DEFCONFIG}"

# Define multilib target
require conf/multilib.conf
MULTILIBS = "multilib:lib32"
DEFAULTTUNE:virtclass-multilib-lib32 = "armv7athf-neon"

# Conditionally add 32-bit libraries only when NOT building QSPI image
IMAGE_INSTALL:append = "${@'' if d.getVar('SSBL_BOOT_SOURCE') == 'qspi' else ' lib32-zlib'}"

# Remove kernel-modules for QSPI builds to save space
IMAGE_INSTALL:remove = "${@'kernel-modules' if d.getVar('SSBL_BOOT_SOURCE') == 'qspi' else ''}"

KBUILD_DEFCONFIG ?= "defconfig"

UBOOT_BINARY = "u-boot.itb"
UBOOT_SUFFIX = "itb"

KERNEL_IMAGETYPE = "Image"

LINUX_DTB_FILE ?= "socfpga_agilex3_socdk.dtb"
KERNEL_DEVICETREE ?= "\
			intel/${LINUX_DTB_FILE} \
			"

UBOOT_ENTRYPOINT = "0x4000000"
UBOOT_LOADADDRESS = "0x4000000"
FIT_KERNEL_COMP_ALG = "none"

SERIAL_CONSOLES ?= "115200;ttyS0"

EXTRA_IMAGECMD:jffs2 ?= "-n -q -e 0x10000"

UBOOT_EXTLINUX ?= "1"
UBOOT_EXTLINUX_LABELS ?= "default"
UBOOT_EXTLINUX_DEFAULT_LABEL ?= "Agilex3 SOCDK SDMMC"

UBOOT_EXTLINUX_MENU_DESCRIPTION:default ?= "Agilex3 SOCDK SDMMC"
UBOOT_EXTLINUX_KERNEL_IMAGE:default ?= "../${KERNEL_IMAGETYPE}"
UBOOT_EXTLINUX_FDTDIR:default ?= ".."
UBOOT_EXTLINUX_CONSOLE ?= "console=ttyS0,115200n8"
UBOOT_EXTLINUX_KERNEL_ARGS:default ?= "rootwait rw earlyprintk"
UBOOT_EXTLINUX_ROOT:default ?= "root=/dev/mmcblk0p2"

UBOOT_DEVICE_TREE ?= "socfpga_agilex3_socdk.dtb"

# Conditionally add device-tree and fpga-bitstream only when NOT building QSPI image
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append = "${@'' if d.getVar('SSBL_BOOT_SOURCE') == 'qspi' else ' device-tree fpga-bitstream'}"

EXTRA_IMAGEDEPENDS:append = " \
		u-boot-socfpga-scr \
		u-boot-socfpga-env-var \
		"

# Add variables for wic creation of sdcard image
IMAGE_BOOT_FILES ?= " \
			${UBOOT_BINARY} \
			Image \
			"

IMAGE_TYPE ?= "gsrd"

# Optimize for QSPI builds - skip systemd and usrmerge for minimal footprint
DISTRO_FEATURES:append = "${@'' if d.getVar('SSBL_BOOT_SOURCE') == 'qspi' else ' systemd usrmerge'}"
INIT_MANAGER = "${@'sysvinit' if d.getVar('SSBL_BOOT_SOURCE') == 'qspi' else 'systemd'}"
# Use dropbear instead of openssh (smaller footprint) and drop gdbserver for QSPI builds
CORE_IMAGE_EXTRA_INSTALL += "${@'dropbear mtd-utils net-tools' if d.getVar('SSBL_BOOT_SOURCE') == 'qspi' else ''}"

WKS_FILE ?= "sdimage.wks"
# multiubi and jffs2 require MULTIUBI_BUILD/MULTIUBI_ARGS from ubifs.inc.
# For XEN builds (HYP_BUILD=1) ubifs.inc is skipped (SD-only), so exclude them.
IMAGE_FSTYPES:append = " wic tar.gz cpio cpio.gz cpio.gz.u-boot"
IMAGE_FSTYPES:append = "${@ '' if d.getVar('HYP_BUILD') == '1' else ' jffs2 multiubi'}"
IMAGE_FEATURES:append = " allow-empty-password empty-root-password"

# XEN Hypervisor Build Support
HYP_BUILD ?= "0"

# XEN packages and kernel modules (conditionally added when HYP_BUILD = "1")
XEN_EXTRA_PACKAGES ??= ""
XEN_EXTRA_PACKAGES:append = "${@'kernel-module-xen-blkback kernel-module-xen-gntalloc kernel-module-xen-gntdev kernel-module-xen-netback kernel-module-xen-wdt xen xen-tools xen-tools-xenstat' if d.getVar('HYP_BUILD') == '1' else ''}"

# Add XEN packages to image when HYP_BUILD is enabled
IMAGE_INSTALL:append = "${@' net-tools ${XEN_EXTRA_PACKAGES}' if d.getVar('HYP_BUILD') == '1' else ''}"

# Add socfpga-xen-passthrough example when HYP_BUILD is enabled
IMAGE_INSTALL:append = "${@' socfpga-xen-passthrough' if d.getVar('HYP_BUILD') == '1' else ''}"

# conserver_8.3.0.bb sets USERADD_PACKAGES conditionally on 'systemd' being in
# DISTRO_FEATURES. QSPI builds use sysvinit (no systemd), so USERADD_PACKAGES
# evaluates to "" which causes a hard parse error in the useradd class.
# Mask the recipe for QSPI builds where it is not needed.
BBMASK += "${@'.*/meta-oe/recipes-connectivity/conserver/.*' if d.getVar('SSBL_BOOT_SOURCE') == 'qspi' else ''}"
