#@TYPE: Machine
#@NAME: Altera SoCFPGA Agilex7
#@DESCRIPTION: Machine configuration for the Agilex7 SoCFPGA

require conf/machine/include/socfpga_armv8a.inc

# For Xen builds (HYP_BUILD=1), ubifs/jffs2 support is disabled - only SD card boot is supported
require ${@'' if d.getVar('HYP_BUILD') == '1' else bb.utils.contains('BBFILE_COLLECTIONS', 'meta-custom', 'conf/machine/include/ubifs.inc', 'conf/machine/include/ubifs_agilex.inc', d)}

# IMAGE_CMD:multiubi (in poky) calls .split() on MULTIUBI_BUILD/MULTIUBI_ARGS at parse
# time for every image recipe. When ubifs.inc is skipped (HYP_BUILD=1), these are None
# which crashes parsing. Provide safe empty-string defaults so parsing always succeeds.
MULTIUBI_BUILD ??= ""
MULTIUBI_ARGS ??= ""

# default root home directory
ROOT_HOME = "/home/root"

# Stripped machine name for FIT images, u-boot env, and xen examples
MACHINE_STRIP = "agilex7"

# ATF platform directory (still "agilex" in arm-trusted-firmware)
ATFPLAT ?= "agilex"

# U-Boot configuration - use defconfig from kas.yml
UBOOT_CONFIG = "agilex-socdk-atf"
UBOOT_CONFIG[agilex-socdk-atf] = "${UBOOT_DEFCONFIG}"

KBUILD_DEFCONFIG ?= "defconfig"

UBOOT_BINARY = "u-boot.itb"
UBOOT_SUFFIX = "itb"

KERNEL_IMAGETYPE = "Image"

LINUX_DTB_FILE ?= "socfpga_agilex_socdk.dtb"

KERNEL_DEVICETREE ?= "\
			intel/${LINUX_DTB_FILE} \
			"
UBOOT_ENTRYPOINT = "0x4000000"
UBOOT_LOADADDRESS = "0x4000000"
FIT_KERNEL_COMP_ALG = "none"

SERIAL_CONSOLES ?= "115200;ttyS0"

EXTRA_IMAGECMD:jffs2 ?= "-n -q -e 0x10000"

UBOOT_EXTLINUX ?= "1"
UBOOT_EXTLINUX_LABELS ?= "default"
UBOOT_EXTLINUX_DEFAULT_LABEL ?= "Agilex SOCDK SDMMC"

UBOOT_EXTLINUX_MENU_DESCRIPTION:default ?= "Agilex SOCDK SDMMC"
UBOOT_EXTLINUX_KERNEL_IMAGE:default ?= "../${KERNEL_IMAGETYPE}"
UBOOT_EXTLINUX_FDTDIR:default ?= ".."
UBOOT_EXTLINUX_CONSOLE ?= "console=ttyS0,115200n8"
UBOOT_EXTLINUX_KERNEL_ARGS:default ?= "rootwait rw earlyprintk"
UBOOT_EXTLINUX_ROOT:default ?= "root=/dev/mmcblk0p2"

UBOOT_DEVICE_TREE ?= "socfpga_agilex_socdk.dtb"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append = "device-tree fpga-bitstream"

EXTRA_IMAGEDEPENDS:append = " \
		u-boot-socfpga-scr \
		u-boot-socfpga-env-var \
		"

IMAGE_BOOT_FILES ?= " \
			${UBOOT_BINARY} \
			boot.scr.uimg \
			kernel.itb \
			Image \
			"

IMAGE_TYPE ?= "gsrd"
DISTRO_FEATURES:append = " systemd usrmerge"
INIT_MANAGER = "systemd"

WKS_FILE ?= "sdimage.wks"
# multiubi and jffs2 require MULTIUBI_BUILD/MULTIUBI_ARGS from ubifs.inc.
# For XEN builds (HYP_BUILD=1) ubifs.inc is skipped (SD-only), so exclude them.
IMAGE_FSTYPES:append = " wic tar.gz cpio cpio.gz cpio.gz.u-boot"
IMAGE_FSTYPES:append = "${@ '' if d.getVar('HYP_BUILD') == '1' else ' jffs2 multiubi'}"
IMAGE_FEATURES:append = " allow-empty-password empty-root-password"

# XEN Hypervisor Build Support
HYP_BUILD ?= "0"

# XEN packages and kernel modules (conditionally added when HYP_BUILD = "1")
XEN_EXTRA_PACKAGES ??= ""
XEN_EXTRA_PACKAGES:append = "${@'kernel-module-xen-blkback kernel-module-xen-gntalloc kernel-module-xen-gntdev kernel-module-xen-netback kernel-module-xen-wdt xen xen-tools xen-tools-xenstat' if d.getVar('HYP_BUILD') == '1' else ''}"

# Add XEN packages to image when HYP_BUILD is enabled
IMAGE_INSTALL:append = "${@' net-tools ${XEN_EXTRA_PACKAGES}' if d.getVar('HYP_BUILD') == '1' else ''}"

# Add socfpga-xen-passthrough example when HYP_BUILD is enabled
IMAGE_INSTALL:append = "${@' socfpga-xen-passthrough' if d.getVar('HYP_BUILD') == '1' else ''}"
