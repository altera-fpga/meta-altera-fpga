# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "altera-bsp"
BBFILE_PATTERN_altera-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_altera-bsp = "5"

# LAYERDEPENDS_altera-bsp = ""
LAYERSERIES_COMPAT_altera-bsp = "wrynose"

BBDEBUG = "yes"

# FIT signing key for the kernel FIT and U-Boot boot script (boot.scr).
# Defaults to the committed development key (files/keys/dev.{key,crt}), which is
# NOT a security boundary - see files/keys/README.md. Override UBOOT_SIGN_KEYDIR
# and UBOOT_SIGN_KEYNAME in local.conf / a distro to sign with a private
# production key.
UBOOT_SIGN_KEYDIR ??= "${LAYERDIR}/files/keys"
UBOOT_SIGN_KEYNAME ??= "dev"
# Absolute path of this layer's committed development keydir. Recipes compare
# UBOOT_SIGN_KEYDIR against this and bbwarn when the public dev key is in use.
SOCFPGA_BSP_DEV_KEYDIR := "${LAYERDIR}/files/keys"
# Backward-compatible alias for older local.conf / docs that still use the
# legacy REFDES variable name.
SOCFPGA_REFDES_DEV_KEYDIR := "${LAYERDIR}/files/keys"
